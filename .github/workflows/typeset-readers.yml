name: typeset-readers

# MANUSCRIPT.tex has its own workflow. The two reader editions are Markdown and
# were never typeset: CAVEMAN_1TO1.md, CAVEMAN.md and LAYMAN.md have only ever
# existed as source on GitHub. This produces PDFs of the two standalone ones so
# they can be read without a browser tab, and leaves the section-for-section
# edition as Markdown because its tables do not survive a narrow page.
#
# Manual only. The PDFs are the artifact; they are also committed back so the
# repository carries them.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and XeLaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-fonts-recommended \
            texlive-latex-recommended lmodern fonts-dejavu-core fonts-dejavu-extra
          pandoc --version | head -2
          xelatex --version | head -1

      - name: Typeset CAVEMAN.md
        run: |
          set -o pipefail
          pandoc CAVEMAN.md -o CAVEMAN.pdf \
            --pdf-engine=xelatex \
            --toc --toc-depth=2 \
            -V geometry:a4paper -V geometry:margin=2cm \
            -V fontsize=10pt \
            -V mainfont="DejaVu Sans" -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true -V linkcolor=blue \
            2>&1 | tee caveman-typeset.log
          ls -l CAVEMAN.pdf

      - name: Typeset LAYMAN.md
        run: |
          set -o pipefail
          pandoc LAYMAN.md -o LAYMAN.pdf \
            --pdf-engine=xelatex \
            --toc --toc-depth=2 \
            -V geometry:a4paper -V geometry:margin=2cm \
            -V fontsize=10pt \
            -V mainfont="DejaVu Sans" -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true -V linkcolor=blue \
            2>&1 | tee layman-typeset.log
          ls -l LAYMAN.pdf

      - name: Report glyph coverage
        if: always()
        run: |
          for f in caveman-typeset.log layman-typeset.log; do
            [ -f "$f" ] || continue
            echo "== $f: $(grep -c 'Missing character' "$f" || true) missing-glyph warnings"
            grep -o "Missing character: There is no .* in font .*" "$f" | sort | uniq -c | head -20 || true
          done
          for f in CAVEMAN.pdf LAYMAN.pdf; do
            [ -f "$f" ] && python3 -c "
import re,sys
b=open('$f','rb').read()
m=re.search(rb'/Count\s+(\d+)', b)
print('$f', len(b), 'bytes, pages', m.group(1).decode() if m else '?')
" || true
          done
          shasum -a 256 CAVEMAN.pdf LAYMAN.pdf 2>/dev/null || true

      - name: Upload PDFs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-pdfs
          path: |
            CAVEMAN.pdf
            LAYMAN.pdf
            caveman-typeset.log
            layman-typeset.log
          if-no-files-found: warn
