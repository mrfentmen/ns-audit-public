name: kernel-check

# The pinned toolchain's `lake` aborts with SIGTRAP in libmalloc on current macOS,
# so the build runs here instead of on a laptop. Nothing upstream is vendored:
# this clones openai/NavierStokesAndEuler at the audited commit and builds it.
#
# Manual only (Actions -> kernel-check -> Run workflow). Public repositories are
# not charged for runner minutes, and no secrets are needed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Clone upstream at the audited commit
        run: |
          git clone --filter=blob:none https://github.com/openai/NavierStokesAndEuler.git upstream
          cd upstream
          git checkout f9e8bc5
          git log -1 --format='%H %ci'

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache only this project's build output, never all of `.lake`: Mathlib's
      # source plus its oleans push that directory past GitHub's 10 GB per-repo
      # cache limit, so a whole-`.lake` cache fails to save without failing the
      # job and every run stays cold. `.lake/build` holds the NavierStokes
      # oleans and the trace files Lake compares against, so a hit skips the
      # 25-45 minute compile. The key is pinned to the audited commit; bump the
      # suffix to invalidate a bad cache.
      - name: Restore compiled build
        uses: actions/cache@v4
        with:
          path: upstream/.lake/build
          key: lake-build-ubuntu-f9e8bc5-v1

      - name: Fetch mathlib cache
        working-directory: upstream
        run: lake exe cache get

      # Full log, not a tail: the artifact is the evidence. `pipefail` keeps the
      # step's status equal to `lake`'s, so a failed build still fails the job,
      # and `tee` streams as it goes so a cancelled run leaves a partial log.
      - name: Build NavierStokes (817 modules)
        working-directory: upstream
        run: |
          set -euo pipefail
          lake build NavierStokes 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Print axioms
        working-directory: upstream
        run: |
          set -euo pipefail
          cat > AxiomsProbe.lean <<'EOF'
          import NavierStokes.ComparatorSolution
          import NavierStokes.PeriodicPaperTheorem
          import NavierStokes.PeriodicPaperComparator

          -- (C) whole space, reproduced on Linux already
          #print axioms NavierStokes.Comparator.navier_stokes_breakdown_R3

          -- (D) periodic: the adapter upstream ships, and the paper theorem behind it
          #print axioms NavierStokes.Comparator.navier_stokes_breakdown_periodic
          #print axioms NavierStokes.PeriodicPaper.periodic_corollary
          #print axioms NavierStokes.ComparatorBridge.option_D_of_paper_candidate
          #print axioms NavierStokes.ComparatorBridge.periodicPaperSolution_of_comparator
          EOF
          lake env lean AxiomsProbe.lean | tee "$GITHUB_WORKSPACE/axioms.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-check-logs
          path: |
            build.log
            axioms.log
            upstream/lake-manifest.json
