name: ledger-check

# CROSSWALK.md's ledger is quoted, with counts, in six other documents, and those
# numbers have drifted four times in this audit's history (E97, E135, E145, E148).
# This turns the next drift into a red build instead of a review finding. The
# check needs no Lean toolchain and no TeX: it is seconds, and it runs on push.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history: the PDF-freshness check compares commit times of the
      # front-door Markdown and its committed PDF, and a shallow clone cannot
      # see when either file last changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the ledger counts against every document
        run: python3 tools/ledger_check.py

      - name: Check the proof-step companion's structure and citations
        run: python3 tools/step_check.py
