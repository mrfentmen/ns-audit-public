name: comparator-check

# The check kernel-check cannot do. `#print axioms` says which axioms a proof
# term names; Comparator says whether the solution proves the *same statement*
# the challenge poses, under an export re-checked in a second kernel.
#
# Run 44999798334 showed the failure mode of the first version: one monolithic
# step, 162 minutes in, no artifact, no exit. GitHub Actions has no resume, so
# a job that reaches its 360-minute cap takes every byte of that work with it.
#
# What changed here, and why it is a real fix rather than a reshuffle:
#
#   * Every expensive step now carries its own `timeout-minutes`. A STEP that
#     times out *fails* and the job continues; a JOB that times out is
#     *cancelled*. Those are different outcomes. Bounding the step converts an
#     unrecoverable loss into a recoverable one.
#   * Each phase uploads its own log the moment it ends, `if: always()`. The
#     artifact is the evidence; it no longer waits on later phases.
#   * Output goes through `stdbuf -oL -eL`, so the log is line-buffered and
#     survives the SIGINT/SIGTERM pair the runner sends at the limit. A
#     block-buffered pipe would lose its tail exactly when we need it.
#   * Each phase stamps its start and duration, so the next run can say which
#     phase actually ate the hours instead of guessing.
#
# Scheduled as well as manual: the cron retries nightly on the default branch,
# so a capped night still leaves a fresh attempt every night without a click.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

# A nightly retry must never stack on top of a run already in flight.
concurrency:
  group: comparator-check
  cancel-in-progress: false

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Clone upstream at the audited commit
        run: |
          git clone --filter=blob:none https://github.com/openai/NavierStokesAndEuler.git upstream
          cd upstream
          git checkout f9e8bc5
          git log -1 --format='%H %ci'

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # landrun is a Go program (it was Rust when Comparator's README was
      # written), and its go.mod asks for a Go newer than the image ships.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # Same key as kernel-check, so this run inherits the compiled NavierStokes
      # oleans instead of spending 28 minutes rebuilding them.
      - name: Restore compiled build
        uses: actions/cache@v4
        with:
          path: upstream/.lake/build
          key: lake-build-ubuntu-f9e8bc5-v1

      - name: Fetch mathlib cache
        working-directory: upstream
        run: lake exe cache get

      - name: Build NavierStokes
        working-directory: upstream
        timeout-minutes: 60
        run: |
          set -euo pipefail
          echo "phase-start build-navierstokes $(date -u +%H:%M:%SZ)"
          lake build NavierStokes 2>&1 | tee "$GITHUB_WORKSPACE/navierstokes-build.log"

      # lean4export is already a pinned Lake dependency; the comparator driver
      # comes from the Comparator package the lakefile requires at v4.34.0-rc2.
      - name: Build comparator and lean4export
        working-directory: upstream
        timeout-minutes: 20
        run: |
          set -euo pipefail
          lake build lean4export 2>&1 | tee "$GITHUB_WORKSPACE/lean4export-build.log"
          (lake build comparator || lake build Comparator:exe:comparator) 2>&1 \
            | tee "$GITHUB_WORKSPACE/comparator-build.log"
          echo "== binaries =="
          ls -l .lake/packages/lean4export/.lake/build/bin/ 2>/dev/null || true
          ls -l .lake/build/bin/ 2>/dev/null || true

      # Required: Comparator will not build anything outside this sandbox.
      # Fetched as a pinned tarball rather than `git clone`: an anonymous clone
      # of a third-party repo from a runner IP comes back 403 often enough to
      # have killed a run already, and a pin is what we wanted anyway.
      - name: Build landrun (sandbox)
        working-directory: upstream
        timeout-minutes: 15
        run: |
          set -euo pipefail
          {
            echo "== go =="; go version
            L=573aa723afb16bb1da2dbe24fc00df46cd0ad13b
            echo "landrun commit: $L"
            mkdir -p /tmp/landrun
            for i in 1 2 3; do
              if curl -fsSL "https://codeload.github.com/Zouuup/landrun/tar.gz/$L" \
                   | tar -xz -C /tmp/landrun --strip-components=1; then break; fi
              echo "tarball attempt $i failed, retrying"; sleep 10
            done
            test -f /tmp/landrun/go.mod || { echo "no go.mod after fetch"; exit 1; }
            cd /tmp/landrun
            go build -o /tmp/landrun-bin ./cmd/landrun
            ls -l /tmp/landrun-bin
          } 2>&1 | tee "$GITHUB_WORKSPACE/landrun-build.log"

      # Optional: release LTO makes this the slowest step, and it is a second
      # opinion. It must never be able to skip the statement check below.
      - name: Build nanoda (second kernel)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -uo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          {
            echo "== rust =="; cargo --version
            N=0da9f98feadd3a0a2ef4b3dbcf52a298a6fef929
            echo "nanoda commit: $N"
            mkdir -p /tmp/nanoda
            for i in 1 2 3; do
              if curl -fsSL "https://codeload.github.com/ammkrn/nanoda_lib/tar.gz/$N" \
                   | tar -xz -C /tmp/nanoda --strip-components=1; then break; fi
              echo "tarball attempt $i failed, retrying"; sleep 10
            done
            test -f /tmp/nanoda/Cargo.toml || { echo "no Cargo.toml after fetch"; exit 1; }
            cargo build --release --manifest-path /tmp/nanoda/Cargo.toml
            ls -l /tmp/nanoda/target/release/nanoda_bin
          } 2>&1 | tee "$GITHUB_WORKSPACE/nanoda-build.log"

      - name: Upload toolchain logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-toolchain-logs
          path: |
            navierstokes-build.log
            lean4export-build.log
            comparator-build.log
            landrun-build.log
            nanoda-build.log
            upstream/lake-manifest.json
          if-no-files-found: warn

      # The one checkpoint that costs nothing and is worth having on its own:
      # the challenge module compiled before Comparator touches it. If the
      # sandbox build was the hidden 160 minutes, this step says so in minutes
      # rather than in a cancelled job with no log.
      - name: Pre-build the challenge module
        working-directory: upstream
        timeout-minutes: 30
        run: |
          set -euo pipefail
          echo "phase-start prebuild-challenge $(date -u +%H:%M:%SZ)"
          START=$SECONDS
          (lake build ComparatorChallenges.NavierStokes || lake build ComparatorChallenges) 2>&1 \
            | tee "$GITHUB_WORKSPACE/challenge-build.log"
          echo "phase-end prebuild-challenge $(( SECONDS - START ))s"
          du -sh .lake/build 2>/dev/null || true

      - name: Upload challenge build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-challenge-build
          path: challenge-build.log
          if-no-files-found: warn

      # The primary run. `enable_nanoda` is stripped so this config asks only for
      # the builtin kernel: a statement check that does not depend on a second
      # kernel having compiled.
      #
      # 300 minutes, not "however long it takes". The job cap is 360, so this
      # leaves an hour of job budget for the uploads that follow. If it fires,
      # the step fails, the job continues, and `comparator-builtin.log` is
      # uploaded with whatever it had reached.
      - name: Comparator (builtin kernel)
        working-directory: upstream
        timeout-minutes: 300
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          src = pathlib.Path("ComparatorChallenges/NavierStokes.json")
          cfg = json.loads(src.read_text())
          cfg.pop("enable_nanoda", None)
          out = pathlib.Path("ComparatorChallenges/NavierStokesBuiltin.json")
          out.write_text(json.dumps(cfg, indent=2) + "\n")
          print(out.read_text())
          PY
          export COMPARATOR_LEAN4EXPORT="$PWD/.lake/packages/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_LANDRUN=/tmp/landrun-bin
          ls -l "$COMPARATOR_LEAN4EXPORT" "$COMPARATOR_LANDRUN"
          # The README wraps its own invocation in `systemd-run --user` to guard a
          # landrun escape fixed in Linux 7.1. The first version of this workflow
          # used `--pty`; runs 44999798334 and 45013487446 then spent 355 and 210
          # minutes under it and uploaded logs holding two lines of systemd
          # chatter and nothing from Comparator. Comparator prints "Building
          # <module>" before it does any work (Main.lean:115), so an empty log is
          # a capture failure, not a slow phase.
          #
          # `--pipe` connects the child's stdout to ours and is the flag meant for
          # redirected output. It is not trusted on that basis: the wrapper has to
          # echo a marker back through the same relay before it is used.
          WRAP=()
          if systemd-run --user --pipe -- true >/dev/null 2>&1; then
            CAND=(systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pipe
                  -E "PATH=$PATH" --working-directory "$PWD" --)
            if [ "$("${CAND[@]}" bash -c 'echo WRAPPER-RELAY-OK' 2>&1)" = "WRAPPER-RELAY-OK" ]; then
              echo "sandbox wrapper: systemd-run --user --pipe AVAILABLE, stdout relay verified"
              WRAP=("${CAND[@]}")
            else
              echo "sandbox wrapper: systemd-run present but NOT relaying stdout; running comparator directly"
              echo "consequence: no guard against the known landrun escape in this run"
            fi
          else
            echo "sandbox wrapper: systemd-run --user --pipe UNAVAILABLE; running comparator directly"
            echo "consequence: no guard against the known landrun escape in this run"
            WRAP=()
          fi
          echo "phase-start comparator-builtin $(date -u +%H:%M:%SZ)"
          START=$SECONDS
          LOG="$GITHUB_WORKSPACE/comparator-builtin.log"
          : > "$LOG"
          # Liveness, independent of Comparator's own output: bytes captured and
          # live Lean processes every five minutes. Without this, a silent child
          # and a dead child look the same in the artifact.
          (
            while :; do
              sleep 300
              printf 'heartbeat %s log_bytes=%s lean_procs=%s\n' \
                "$(date -u +%H:%M:%SZ)" \
                "$(wc -c < "$LOG" 2>/dev/null || echo 0)" \
                "$(pgrep -fc 'lean|lake' 2>/dev/null || echo 0)" >> "$LOG"
            done
          ) &
          HB=$!
          # `stdbuf -oL` wraps the *producer*, not `tee`: on a timeout the runner
          # sends SIGINT, then SIGTERM 7.5s later, and a block-buffered producer
          # would lose the tail precisely when it becomes the only evidence.
          "${WRAP[@]}" stdbuf -oL -eL bash -c \
            "lake exe comparator ComparatorChallenges/NavierStokesBuiltin.json" 2>&1 \
            | tee -a "$LOG"
          kill "$HB" 2>/dev/null || true
          echo "phase-end comparator-builtin $(( SECONDS - START ))s"

      - name: Upload builtin-kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-builtin-kernel
          path: comparator-builtin.log
          if-no-files-found: warn

      # The second opinion. Its failure is a finding about the toolchain, not a
      # reason to discard the statement check above.
      - name: Comparator (nanoda as second kernel)
        working-directory: upstream
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -uo pipefail
          export COMPARATOR_LEAN4EXPORT="$PWD/.lake/packages/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_LANDRUN=/tmp/landrun-bin
          export COMPARATOR_NANODA=/tmp/nanoda/target/release/nanoda_bin
          WRAP=()
          if systemd-run --user --pipe -- true >/dev/null 2>&1 \
             && [ "$(systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pipe \
                     -E "PATH=$PATH" --working-directory "$PWD" -- bash -c 'echo WRAPPER-RELAY-OK' 2>&1)" = "WRAPPER-RELAY-OK" ]; then
            WRAP=(systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pipe
                  -E "PATH=$PATH" --working-directory "$PWD" --)
          fi
          if [ ! -x "$COMPARATOR_NANODA" ]; then
            echo "nanoda binary absent; second-kernel check skipped, recorded as SKIPPED"
            exit 0
          fi
          echo "phase-start comparator-nanoda $(date -u +%H:%M:%SZ)"
          START=$SECONDS
          "${WRAP[@]}" stdbuf -oL -eL bash -c \
            "lake exe comparator ComparatorChallenges/NavierStokes.json" 2>&1 \
            | tee "$GITHUB_WORKSPACE/comparator-nanoda.log"
          echo "phase-end comparator-nanoda $(( SECONDS - START ))s"

      - name: Upload nanoda log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-nanoda-kernel
          path: comparator-nanoda.log
          if-no-files-found: warn

      # One place that says whether a verdict was reached, so a reader does not
      # have to infer it from step colours. Absence of a line here is the
      # honest answer when a phase was cut short.
      - name: Verdict summary
        if: always()
        run: |
          {
            echo "# comparator-check summary"
            echo
            echo "run: ${GITHUB_RUN_ID}  attempt ${GITHUB_RUN_ATTEMPT}  $(date -u +%FT%TZ)"
            echo "head: ${GITHUB_SHA}"
            echo
            for f in comparator-builtin.log comparator-nanoda.log challenge-build.log; do
              echo "## $f"
              if [ -f "$f" ]; then
                echo "lines: $(wc -l < "$f")  bytes: $(wc -c < "$f")"
                echo "last 15:"
                tail -15 "$f"
              else
                echo "ABSENT — the phase that writes it never started"
              fi
              echo
            done
          } > verdict-summary.md
          cat verdict-summary.md

      - name: Upload verdict summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-verdict-summary
          path: verdict-summary.md
          if-no-files-found: warn
