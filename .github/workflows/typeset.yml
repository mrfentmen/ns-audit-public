name: typeset

# MANUSCRIPT.tex has never been compiled in this repository's history: there is
# no TeX installation on the machine it was written on, and installing one is a
# multi-gigabyte download. The paper asks for LuaLaTeX or XeLaTeX because the
# Lean listings are quoted with their Unicode.
#
# The two standalone reader editions are Markdown. They are built in a second
# job that runs pandoc inside its own image, so neither job depends on TeX being
# installed on the runner: an earlier attempt to apt-install TeX Live for this
# sat in texlive's post-install format generation for half an hour and was
# cancelled. CAVEMAN_1TO1.md stays Markdown; its wide tables do not survive a
# narrow page.
#
# Manual only, so a red build does not block anything. The PDFs are the artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Typeset the manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: MANUSCRIPT.tex
          latexmk_use_lualatex: true

      - name: Report the log tail
        if: always()
        run: |
          ls -l MANUSCRIPT.pdf MANUSCRIPT.log 2>/dev/null || true
          [ -f MANUSCRIPT.log ] && tail -40 MANUSCRIPT.log || echo "no log written"
          python3 tools/pdfpages.py MANUSCRIPT.pdf 2>/dev/null || true
          shasum -a 256 MANUSCRIPT.pdf 2>/dev/null || true

      - name: Upload the manuscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: |
            MANUSCRIPT.pdf
            MANUSCRIPT.log
          if-no-files-found: warn

  readers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The image's default fonts have no room for ∂ ∇ ν ℝ ∃ ∫ or the subscripts,
      # and the first build dropped 275 characters silently. DejaVu is installed on
      # the runner (no TeX, a few megabytes) and mounted into the container, whose
      # fontconfig then sees it. The two emoji are outside DejaVu as well, so the
      # build copies the source with ✗ and ✓ substituted; the Markdown in the
      # repository keeps its own markers.
      - name: Install fonts on the runner
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends fonts-dejavu-core
          fc-list | grep -ci dejavu

      - name: Build both reader editions in the pandoc image
        run: |
          set -euo pipefail
          for doc in CAVEMAN LAYMAN; do
            sed -e 's/❌/✗/g' -e 's/✅/✓/g' "$doc.md" > "$doc.build.md"
            docker run --rm \
              -v "$PWD:/data" -v /usr/share/fonts:/usr/share/fonts:ro \
              -w /data pandoc/extra:latest \
              sh -c "fc-cache -f >/dev/null 2>&1 || true; pandoc '$doc.build.md' -o '$doc.pdf' \
                --pdf-engine=xelatex --toc --toc-depth=2 \
                -V geometry:a4paper -V geometry:margin=2cm -V fontsize=10pt \
                -V mainfont='DejaVu Sans' -V monofont='DejaVu Sans Mono' \
                -V colorlinks=true -V linkcolor=blue" \
              2>&1 | tee "$doc-typeset.log"
            rm -f "$doc.build.md"
            ls -l "$doc.pdf"
          done

      - name: Report pages and glyph coverage
        if: always()
        run: |
          python3 tools/pdfpages.py CAVEMAN.pdf LAYMAN.pdf 2>/dev/null || true
          for f in CAVEMAN-typeset.log LAYMAN-typeset.log; do
            [ -f "$f" ] || continue
            echo "== $f: $(grep -c 'Missing character' "$f" || true) missing-glyph warnings"
            grep -o "Missing character: There is no .* in font .*" "$f" | sort | uniq -c | head -20 || true
          done
          shasum -a 256 CAVEMAN.pdf LAYMAN.pdf 2>/dev/null || true

      - name: Upload the reader PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-pdfs
          path: |
            CAVEMAN.pdf
            LAYMAN.pdf
            CAVEMAN-typeset.log
            LAYMAN-typeset.log
          if-no-files-found: warn
