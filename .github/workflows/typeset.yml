name: typeset

# MANUSCRIPT.tex has never been compiled in this repository's history: there is
# no TeX installation on the machine it was written on, and installing one is a
# multi-gigabyte download. The paper asks for LuaLaTeX or XeLaTeX because the
# Lean listings are quoted with their Unicode.
#
# The two standalone reader editions are Markdown and are typeset here as well,
# with pandoc and XeLaTeX on the runner itself. CAVEMAN_1TO1.md stays Markdown
# because its wide tables do not survive a narrow page. librsvg is installed
# because the documents embed the SVG diagrams by path.
#
# Manual only, so a red build does not block anything. The PDFs are the artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Typeset the manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: MANUSCRIPT.tex
          latexmk_use_lualatex: true

      - name: Install pandoc, XeLaTeX and helpers on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-fonts-recommended \
            texlive-latex-recommended lmodern fonts-dejavu-core fonts-dejavu-extra \
            librsvg2-bin poppler-utils
          pandoc --version | head -2
          xelatex --version | head -1

      - name: Typeset CAVEMAN.md
        run: |
          set -o pipefail
          pandoc CAVEMAN.md -o CAVEMAN.pdf \
            --pdf-engine=xelatex --toc --toc-depth=2 \
            -V geometry:a4paper -V geometry:margin=2cm -V fontsize=10pt \
            -V mainfont="DejaVu Sans" -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true -V linkcolor=blue \
            2>&1 | tee caveman-typeset.log
          ls -l CAVEMAN.pdf

      - name: Typeset LAYMAN.md
        run: |
          set -o pipefail
          pandoc LAYMAN.md -o LAYMAN.pdf \
            --pdf-engine=xelatex --toc --toc-depth=2 \
            -V geometry:a4paper -V geometry:margin=2cm -V fontsize=10pt \
            -V mainfont="DejaVu Sans" -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true -V linkcolor=blue \
            2>&1 | tee layman-typeset.log
          ls -l LAYMAN.pdf

      - name: Report logs, pages and glyph coverage
        if: always()
        run: |
          ls -l MANUSCRIPT.pdf MANUSCRIPT.log 2>/dev/null || true
          [ -f MANUSCRIPT.log ] && tail -40 MANUSCRIPT.log || echo "no manuscript log written"
          for f in caveman-typeset.log layman-typeset.log; do
            [ -f "$f" ] || continue
            echo "== $f: $(grep -c 'Missing character' "$f" || true) missing-glyph warnings"
            grep -o "Missing character: There is no .* in font .*" "$f" | sort | uniq -c | head -20 || true
          done
          for f in MANUSCRIPT.pdf CAVEMAN.pdf LAYMAN.pdf; do
            [ -f "$f" ] || continue
            echo "$f: $(stat -c%s "$f") bytes, $(pdfinfo "$f" 2>/dev/null | awk '/^Pages:/{print $2}') pages"
          done
          shasum -a 256 MANUSCRIPT.pdf CAVEMAN.pdf LAYMAN.pdf 2>/dev/null || true

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: |
            MANUSCRIPT.pdf
            MANUSCRIPT.log
            CAVEMAN.pdf
            LAYMAN.pdf
            caveman-typeset.log
            layman-typeset.log
          if-no-files-found: warn
