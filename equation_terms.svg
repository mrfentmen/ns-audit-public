<radialGradient id="pg" cx="0.5" cy="0.5" r="0.5">
<stop offset="0%" stop-color="#805ad5" stop-opacity="0.30"/>
<stop offset="100%" stop-color="#805ad5" stop-opacity="0.02"/>
</radialGradient>
</defs>
