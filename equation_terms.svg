<polygon points="240.0,244.0 234.0,254.0 246.0,254.0" fill="#718096"/>
<line x1="330.0" y1="300.0" x2="330.0" y2="225.0" stroke="#718096" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="330.0,219.0 324.0,229.0 336.0,229.0" fill="#718096"/>
<line x1="420.0" y1="300.0" x2="420.0" y2="195.0" stroke="#c05621" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="420.0,189.0 414.0,199.0 426.0,199.0" fill="#c05621"/>
<line x1="150.0" y1="300.0" x2="150.0" y2="306.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="240.0" y1="300.0" x2="240.0" y2="306.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="330.0" y1="300.0" x2="330.0" y2="306.0" stroke="#4a5568" stroke-width="1.2"/>
<line x1="420.0" y1="300.0" x2="420.0" y2="306.0" stroke="#4a5568" stroke-width="1.2"/>
<text x="150.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">t₁</text>
<text x="240.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">t₂</text>
<text x="330.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">t₃</text>
<text x="420.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">t₄</text>
<text x="80.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">stand still at one point: the arrow there keeps growing</text>

<rect x="520" y="150" width="440" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="540.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c05621" text-anchor="start" font-weight="bold">(b)  (u·∇)u — the villain</text>
<text x="560.0" y="206.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">a spinning tube is stretched by its own spin</text>
<ellipse cx="600.0" cy="255.0" rx="46.0" ry="16.0" fill="#c05621" fill-opacity="0.10" stroke="#c05621" stroke-width="2"/>
<ellipse cx="860.0" cy="255.0" rx="16.0" ry="9.0" fill="#c05621" fill-opacity="0.18" stroke="#c05621" stroke-width="2"/>
<line x1="600.0" y1="239.0" x2="860.0" y2="246.0" stroke="#c05621" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>
<line x1="600.0" y1="271.0" x2="860.0" y2="264.0" stroke="#c05621" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>
<path d="M582.0,264.0 A24,9 0 0 1 618.0,246.0" fill="none" stroke="#c05621" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="620.0,245.0 610.0,245.0 616.0,253.0" fill="#c05621"/>
<path d="M846.0,262.0 A18,7 0 0 1 874.0,248.0" fill="none" stroke="#c05621" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="876.0,247.0 866.0,247.0 872.0,254.0" fill="#c05621"/>
<text x="600.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">spin ω</text>
<text x="872.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c05621" text-anchor="middle" font-weight="bold">ω′ &gt; ω</text>
<text x="730.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="normal">thinner, same angular momentum</text>
<text x="540.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">nothing pushed her — the ice skater pulled her own arms in</text>

<rect x="60" y="370" width="440" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="80.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">(c)  −νΔu — the smoother</text>
<polyline points="95,500 109,482 123,518 137,482 151,518 165,482 179,518 193,482 207,518 221,482 235,500" fill="none" stroke="#c05621" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320,500 C335,478 350,478 365,500 C380,522 395,522 410,500 C425,478 440,478 455,500" fill="none" stroke="#2b6cb0" stroke-width="2.6" stroke-linecap="round"/>
<line x1="248.0" y1="470.0" x2="300.0" y2="470.0" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/>
<polygon points="306.0,470.0 296.0,465.0 296.0,475.0" fill="#4a5568"/>
<text x="274.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="normal">blur</text>
<line x1="95.0" y1="515.0" x2="465.0" y2="515.0" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="165.0" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">sharp differences</text>
<text x="390.0" y="534.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="normal">smooth again</text>
<text x="80.0" y="556.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">the minus sign is the point: ν only ever removes energy</text>

<rect x="520" y="370" width="440" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="540.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#805ad5" text-anchor="start" font-weight="bold">(d)  ∇p — the ghost</text>
