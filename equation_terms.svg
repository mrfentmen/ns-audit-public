<text x="740.0" y="474.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#805ad5" text-anchor="middle" font-weight="bold">p↑</text>
<text x="836.0" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">the far side</text>
<text x="836.0" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">feels it at once</text>
<text x="540.0" y="556.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">not a field you track — pressure is solved from u, everywhere</text>

<rect x="60" y="590" width="900" height="76" rx="8" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<rect x="84" y="604" width="46" height="26" rx="5" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a"/>
<text x="107.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2f855a" text-anchor="middle" font-weight="bold">f</text>
<text x="142.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="start" font-weight="bold">the hand outside — it can push energy in or pull it out</text>
<text x="142.0" y="644.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">with f = 0 the total sloshing can only fall, never rise</text>
<line x1="520.0" y1="604.0" x2="520.0" y2="652.0" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="544.0" y="622.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a202c" text-anchor="start" font-weight="bold">∇·u = 0 — the rule none of them may break</text>
<text x="544.0" y="644.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="start" font-weight="normal">in equals out: no bunching up, no spreading out</text>
</svg>
