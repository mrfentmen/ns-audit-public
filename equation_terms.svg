<line x1="723.0" y1="453.0" x2="709.0" y2="439.0" stroke="#805ad5" stroke-width="2"/>
<line x1="740.0" y1="446.0" x2="740.0" y2="426.0" stroke="#805ad5" stroke-width="2"/>
