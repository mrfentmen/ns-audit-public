<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="t d">
<title id="t">The four terms of the Navier-Stokes equation, one job each</title>
<desc id="d">Four panels: the time derivative measures change at a fixed point; advection stretches a spinning tube thinner and faster; viscosity blurs sharp differences and removes energy; the pressure gradient answers everywhere at once. A bottom band states that the force can add or remove energy and that incompressibility constrains the flow.</desc>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="60.0" y="36.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1a202c" text-anchor="start" font-weight="bold">One equation, four jobs</text>
<text x="60.0" y="58.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5568" text-anchor="start" font-weight="normal">each term of the momentum balance does something different to the fluid</text>
<text x="60.0" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">∂ₜu  +  (u·∇)u  −  νΔu  +  ∇p  =  f        with        ∇·u = 0</text>

<rect x="60" y="100" width="80" height="32" rx="6" fill="#718096" fill-opacity="0.10" stroke="#718096"/>
<text x="100.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="bold">∂ₜu</text>
<text x="152.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="normal">+</text>
<rect x="166" y="100" width="96" height="32" rx="6" fill="#c05621" fill-opacity="0.10" stroke="#c05621"/>
<text x="214.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c05621" text-anchor="middle" font-weight="bold">(u·∇)u</text>
<text x="274.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="normal">−</text>
<rect x="288" y="100" width="88" height="32" rx="6" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0"/>
<text x="332.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">νΔu</text>
<text x="388.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="normal">+</text>
<rect x="402" y="100" width="64" height="32" rx="6" fill="#805ad5" fill-opacity="0.10" stroke="#805ad5"/>
<text x="434.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#805ad5" text-anchor="middle" font-weight="bold">∇p</text>
<text x="482.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="normal">=</text>
<rect x="496" y="100" width="52" height="32" rx="6" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a"/>
<text x="522.0" y="121.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f855a" text-anchor="middle" font-weight="bold">f</text>

<rect x="60" y="150" width="440" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="80.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start" font-weight="bold">(a)  ∂ₜu — the clock term</text>
<line x1="95.0" y1="300.0" x2="465.0" y2="300.0" stroke="#4a5568" stroke-width="1.3" stroke-linecap="round"/>
<line x1="150.0" y1="300.0" x2="150.0" y2="270.0" stroke="#718096" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="150.0,264.0 144.0,274.0 156.0,274.0" fill="#718096"/>
