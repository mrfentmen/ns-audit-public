<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d">
<title id="t">The generalized cone and the two anisotropic viscous weights</title>
<desc id="d">Left: the cone |z| = r^(1-2h) for h=0 (straight, excluded), h=1/4, and h=0.4. Right: the radial degree b-1 is constant in h while the axial degree b-2D(h) rises with slope 2, so the gap is 2h.</desc>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="60.0" y="36.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#1a202c" text-anchor="start" font-weight="bold">One Laplacian, two homogeneous pieces</text>
<text x="60.0" y="58.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4a5568" text-anchor="start" font-weight="normal">the cone's opening exponent D(h) sets the gap between them</text>
<text x="60.0" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5568" text-anchor="start" font-weight="normal">Δax = 2s ∂s² + 2 ∂s + ∂z²   →   radial: q^(b−1)   +   axial: q^(b−2D(h)),    D(h) = ½ − h</text>
<text x="90.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a202c" text-anchor="start" font-weight="bold">(a) The generalized cone:  |z| = r^(1−2h)</text>
